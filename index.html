<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Banco Digital</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="conteudo">
        <header class="topo">
            <div>
                <h1>Banco Digital</h1>
                <p id="status" class="status" role="status">Aguardando dados...</p>
            </div>
            <button id="atualizar" type="button">Atualizar agora</button>
        </header>

        <main id="painel" class="painel">
            <section class="cartao total">
                <h2>Saldo total do banco</h2>
                <p id="saldo-total" class="valor-grande">-</p>
                <p id="quantidade" class="quantidade"></p>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
